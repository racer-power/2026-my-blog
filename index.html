<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Blog</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/theme.js"></script>
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="site-title">My Blog</a>
      <button id="theme-toggle" aria-label="다크 모드로 전환">🌙</button>
    </div>
  </header>

  <main class="container">
    <section class="apps-section" aria-label="웹앱">
      <h2 class="section-title">웹앱</h2>
      <div class="app-cards">
        <a href="apps/2048/index.html" class="app-card">
          <div class="app-card__preview">
            <div class="mini-tile" style="--c:#f2b179">8</div>
            <div class="mini-tile" style="--c:#edcf72">128</div>
            <div class="mini-tile" style="--c:#edc22e">2048</div>
            <div class="mini-tile" style="--c:#f67c5f">32</div>
          </div>
          <div class="app-card__body">
            <h3 class="app-card__title">2048</h3>
            <p class="app-card__desc">방향키로 타일을 밀어 2048을 만드는 퍼즐 게임</p>
          </div>
        </a>
      </div>
    </section>

    <section aria-label="포스트 목록">
      <h2 class="section-title">포스트</h2>
      <div id="post-list" role="list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="container">
      <p>© 2026 My Blog</p>
    </div>
  </footer>

  <script src="js/loader.js"></script>
</body>
</html>
